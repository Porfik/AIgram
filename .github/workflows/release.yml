name: Release.

# A tag like v7.3.3-aigram.1 builds the clients and publishes a GitHub
# release; a manual run builds them as workflow artifacts only.
on:
  push:
    tags:
      - 'v*-aigram*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Check credentials.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Set the TDESKTOP_API_ID and TDESKTOP_API_HASH repository secrets."
            exit 1
          fi

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Telegram Desktop build.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -e CONFIG=Release \
          $IMAGE_TAG \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D TDESKTOP_API_ID=$API_ID \
          -D TDESKTOP_API_HASH=$API_HASH \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Package.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION=$GITHUB_REF_NAME
          else
            VERSION=${GITHUB_SHA::10}
          fi
          PACKAGE=AIgram-linux-x64-$VERSION.tar.xz
          mkdir -p package/AIgram
          strip -o package/AIgram/AIgram out/Release/Telegram
          XZ_OPT='-T0 -6' tar -C package -cJf $PACKAGE AIgram
          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}
          retention-days: 7

      - name: Publish release.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE" \
              --verify-tag \
              --title "AIgram $GITHUB_REF_NAME" \
              --notes "Linux x64: extract the archive and run AIgram/AIgram."
          fi
